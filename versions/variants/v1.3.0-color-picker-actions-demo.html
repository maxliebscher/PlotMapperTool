<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlotMapper v1.3.0 - Farbwähler Aktionen</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: #211f1a;
      --panel-strong: #2f2a21;
      --surface: #463d30;
      --surface-2: #5a4d3a;
      --border: #82735c;
      --text: #f4efe5;
      --muted: #c6bcae;
      --accent: #1590d7;
      --accent-2: #2bbf8d;
      --warn: #d86a53;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background: radial-gradient(circle at 40% 20%, #26363a, #1d0d15 62%);
      color: var(--text);
    }

    main {
      width: min(960px, 100%);
      display: grid;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .variants {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      align-items: start;
    }

    .variant {
      display: grid;
      gap: 10px;
    }

    .variant h2 {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
    }

    .color-popover {
      width: 230px;
      display: grid;
      gap: 9px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel-strong) 96%, transparent);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    }

    .color-popover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 760;
      white-space: nowrap;
    }

    .btn.primary {
      border-color: color-mix(in srgb, var(--accent-2) 82%, white 10%);
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent-2) 72%, var(--surface)), color-mix(in srgb, var(--accent) 44%, var(--surface)));
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-2) 24%, transparent);
    }

    .btn.ghost {
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      color: var(--muted);
    }

    input[type="color"] {
      width: 100%;
      height: 34px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
    }

    .native-pad {
      height: 168px;
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 6px;
      background: linear-gradient(180deg, #83ffe1, #111);
    }

    .color-popover-actions {
      display: flex;
      gap: 7px;
    }

    .color-popover-actions .primary {
      flex: 1 1 auto;
    }

    .footer-actions {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 8px;
      padding-top: 3px;
      border-top: 1px solid color-mix(in srgb, var(--border) 52%, transparent);
    }

    .confirm-strip {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 7px;
      border: 1px solid color-mix(in srgb, var(--accent-2) 46%, var(--border));
      border-radius: 10px;
      background: color-mix(in srgb, var(--accent-2) 13%, var(--surface));
    }

    .swatch {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: #28ba8b;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>
  <main>
    <h1>Farbwähler: Bestätigung sichtbarer machen</h1>
    <section class="variants" aria-label="Varianten">
      <article class="variant">
        <h2>Variante A: Primär in der Kopfleiste</h2>
        <div class="color-popover">
          <div class="color-popover-header">
            <span>Farbe wählen</span>
            <div class="color-popover-actions">
              <button class="btn primary" type="button">✓ OK</button>
              <button class="btn ghost" type="button">× Abbrechen</button>
            </div>
          </div>
          <input type="color" value="#28ba8b">
          <div class="native-pad"></div>
        </div>
      </article>
      <article class="variant">
        <h2>Variante B: Fußleiste</h2>
        <div class="color-popover">
          <div class="color-popover-header"><span>Farbe wählen</span></div>
          <input type="color" value="#28ba8b">
          <div class="native-pad"></div>
          <div class="footer-actions">
            <button class="btn primary" type="button">✓ OK</button>
            <button class="btn ghost" type="button">× Abbrechen</button>
          </div>
        </div>
      </article>
      <article class="variant">
        <h2>Variante C: Bestätigungsstreifen</h2>
        <div class="color-popover">
          <div class="color-popover-header"><span>Farbe wählen</span></div>
          <input type="color" value="#28ba8b">
          <div class="native-pad"></div>
          <div class="confirm-strip">
            <span class="swatch" aria-hidden="true"></span>
            <button class="btn primary" type="button">✓ Übernehmen</button>
            <button class="btn ghost" type="button">×</button>
          </div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
